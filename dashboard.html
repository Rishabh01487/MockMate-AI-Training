<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MockMate AI Training Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #050508; color: #e2e8f0; min-height: 100vh; }
    .header { padding: 1.2rem 2rem; background: rgba(10,10,15,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header-brand { display: flex; align-items: center; gap: 0.6rem; font-size: 1.15rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a78bfa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .header-brand .emoji { -webkit-text-fill-color: initial; }
    .header-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; color: #64748b; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
    .status-dot.online { background: #22c55e; } .status-dot.offline { background: #ef4444; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .main { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    .phase-banner { padding: 1rem 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
    .phase-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .phase-desc { color: #cbd5e1; font-size: 0.88rem; }
    .progress-card { padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; background: #111827; border: 1px solid #1e293b; }
    .progress-header { display: flex; justify-content: space-between; margin-bottom: 0.6rem; }
    .progress-label { font-weight: 700; font-size: 0.85rem; }
    .progress-count { color: #6366f1; font-weight: 700; }
    .progress-track { height: 14px; border-radius: 7px; background: #1e293b; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 7px; transition: width 1.5s cubic-bezier(.4,0,.2,1); background: linear-gradient(90deg, #6366f1, #8b5cf6); }
    .progress-fill.ready { background: linear-gradient(90deg, #6366f1, #22c55e); }
    .progress-hint { color: #64748b; font-size: 0.75rem; margin-top: 0.5rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { padding: 1.3rem; border-radius: 14px; background: #111827; border: 1px solid #1e293b; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 900; } .stat-value.text { font-size: 0.85rem; font-weight: 700; }
    .stat-label { font-size: 0.7rem; color: #64748b; margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card { padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; background: #111827; border: 1px solid #1e293b; }
    .card h3 { font-weight: 700; font-size: 0.95rem; margin-bottom: 1rem; }
    .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .bar-label { width: 140px; font-size: 0.8rem; color: #94a3b8; text-transform: capitalize; }
    .bar-track { flex: 1; height: 10px; border-radius: 5px; background: #1e293b; }
    .bar-fill { height: 100%; border-radius: 5px; background: #6366f1; transition: width 0.8s ease; }
    .bar-count { font-size: 0.8rem; font-weight: 700; min-width: 35px; text-align: right; }
    .source-pills { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .source-pill { padding: 0.6rem 1.2rem; border-radius: 10px; background: #1e293b; display: flex; align-items: center; gap: 0.5rem; }
    .source-pill-label { font-size: 0.8rem; color: #94a3b8; } .source-pill-count { font-weight: 700; color: #e2e8f0; }
    .btn-export { padding: 0.65rem 1.8rem; border-radius: 10px; border: none; background: #6366f1; color: #fff; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .btn-export:hover { background: #4f46e5; } .btn-export:disabled { background: #334155; cursor: not-allowed; }
    .export-desc { color: #64748b; font-size: 0.82rem; margin-bottom: 1rem; }
    .export-desc code { color: #6366f1; background: #1e1e3a; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .export-result { margin-top: 0.75rem; padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.82rem; }
    .export-result.success { background: #14532d; color: #86efac; } .export-result.error { background: #7f1d1d; color: #fca5a5; }
    .roadmap { display: flex; flex-direction: column; gap: 0.85rem; }
    .roadmap-step { display: flex; align-items: center; gap: 0.85rem; }
    .roadmap-num { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
    .roadmap-num.done { background: #22c55e; color: #fff; } .roadmap-num.pending { background: #1e293b; color: #64748b; }
    .roadmap-title { font-weight: 600; font-size: 0.88rem; } .roadmap-title.done { color: #22c55e; }
    .roadmap-desc { font-size: 0.75rem; color: #64748b; }
    .config-input { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 0.5rem 0.8rem; color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: 0.85rem; width: 300px; }
    .btn-save { padding: 0.5rem 1.2rem; border-radius: 8px; border: none; background: #22c55e; color: #fff; font-weight: 600; font-size: 0.82rem; cursor: pointer; margin-left: 0.5rem; }
    .auto-refresh { text-align: center; padding: 0.5rem; color: #374151; font-size: 0.7rem; margin-top: 2rem; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-brand"><span class="emoji">🧠</span> MockMate AI Training</div>
  <div class="header-status"><div class="status-dot" id="statusDot"></div><span id="statusText">Connecting...</span></div>
</div>
<div class="main" id="app"><div style="text-align:center;padding:4rem;color:#475569;">Connecting to backend...</div></div>

<script>
// Use relative path for Vercel functions, or localhost for local testing
const API_URL = ''; 

let stats = null, exportResult = null, exporting = false;

async function fetchStats() {
  try {
    const res = await fetch(`/api/training/stats`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    stats = await res.json();
    updateStatus(true);
    render();
  } catch (err) {
    updateStatus(false);
    document.getElementById('app').innerHTML = `
      <div style="text-align:center;padding:3rem;">
        <div style="font-size:2rem;margin-bottom:1rem;">⚠️</div>
        <div style="color:#f59e0b;font-weight:700;margin-bottom:0.5rem;">Database Connection Required</div>
        <div style="color:#64748b;font-size:0.85rem;margin-bottom:1.5rem;">Make sure <code>MONGODB_URI</code> is set in Vercel.</div>
        <div style="display:flex;align-items:center;gap:0.5rem;justify-content:center;flex-wrap:wrap;">
           <button onclick="fetchStats()" style="padding:0.7rem 1.5rem;border-radius:10px;border:none;background:#6366f1;color:#fff;font-weight:700;cursor:pointer;">Retry Connection</button>
        </div>
      </div>`;
  }
}

async function doExport() {
  exporting = true; exportResult = null; render();
  try {
    const res = await fetch(`/api/training/export`, { method: 'POST' });
    exportResult = await res.json(); 
    if (exportResult.data && exportResult.data.length > 0) {
      downloadJsonl(exportResult.data);
    }
    fetchStats();
  } catch (err) { exportResult = { error: err.message }; }
  exporting = false; render();
}

function downloadJsonl(data) {
  const blob = new Blob([data.join('\n')], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mockmate_data_${new Date().toISOString().slice(0,10)}.jsonl`;
  a.click();
}

function updateStatus(online) {
  document.getElementById('statusDot').className = `status-dot ${online ? 'online' : 'offline'}`;
  document.getElementById('statusText').textContent = online ? `MongoDB Connected` : 'Database Offline';
}

function render() {
  const app = document.getElementById('app');
  const total = stats?.totalSamples || 0, target = 500;
  const progress = Math.min(100, Math.round((total / target) * 100));
  const domainEntries = Object.entries(stats?.byDomain || {});
  const sourceEntries = Object.entries(stats?.bySource || {});
  const maxDomain = Math.max(...domainEntries.map(d => d[1]), 1);
  const phase = total === 0 ? 'collecting' : total < 100 ? 'early' : total < 500 ? 'growing' : total < 1000 ? 'ready' : 'mature';
  const phases = {
    collecting: { label: 'Just Started', color: '#ef4444', bg: 'rgba(239,68,68,0.08)', border: 'rgba(239,68,68,0.2)', desc: 'Start using MockMate to collect training data' },
    early: { label: 'Early Collection', color: '#f59e0b', bg: 'rgba(245,158,11,0.08)', border: 'rgba(245,158,11,0.2)', desc: 'Keep practicing! Need more data for training' },
    growing: { label: 'Growing Dataset', color: '#3b82f6', bg: 'rgba(59,130,246,0.08)', border: 'rgba(59,130,246,0.2)', desc: 'Good progress! Dataset is building up nicely' },
    ready: { label: 'Ready to Train! 🎉', color: '#22c55e', bg: 'rgba(34,197,94,0.08)', border: 'rgba(34,197,94,0.2)', desc: 'You have enough data to fine-tune a model!' },
    mature: { label: 'Rich Dataset 🚀', color: '#8b5cf6', bg: 'rgba(139,92,246,0.08)', border: 'rgba(139,92,246,0.2)', desc: 'Excellent! Large dataset for high-quality fine-tuning' },
  };
  const p = phases[phase];
  app.innerHTML = `
    <div class="phase-banner" style="background:${p.bg};border:1px solid ${p.border}"><span class="phase-badge" style="background:${p.color}">${p.label}</span><span class="phase-desc">${p.desc}</span></div>
    <div class="progress-card"><div class="progress-header"><span class="progress-label">Training Data Progress</span><span class="progress-count">${total} / ${target} samples</span></div><div class="progress-track"><div class="progress-fill ${progress >= 100 ? 'ready' : ''}" style="width:${progress}%"></div></div><div class="progress-hint">${progress >= 100 ? '✅ Ready for fine-tuning!' : `${target - total} more samples needed`}</div></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" style="color:#6366f1">${total}</div><div class="stat-label">Total Samples</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#f59e0b">${stats?.unexported || 0}</div><div class="stat-label">Unexported</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#3b82f6">${domainEntries.length}</div><div class="stat-label">Domains</div></div>
      <div class="stat-card"><div class="stat-value text" style="color:#22c55e">${stats?.estimatedFinetuneReady || 'Collecting'}</div><div class="stat-label">Status</div></div>
    </div>
    ${domainEntries.length ? `<div class="card"><h3>📊 Samples by Domain</h3>${domainEntries.map(([d,c]) => `<div class="bar-row"><span class="bar-label">${d}</span><div class="bar-track"><div class="bar-fill" style="width:${(c/maxDomain)*100}%"></div></div><span class="bar-count">${c}</span></div>`).join('')}</div>` : ''}
    ${sourceEntries.length ? `<div class="card"><h3>📁 Samples by Source</h3><div class="source-pills">${sourceEntries.map(([s,c]) => `<div class="source-pill"><span class="source-pill-label">${s}</span><span class="source-pill-count">${c}</span></div>`).join('')}</div></div>` : ''}
    <div class="card"><h3>💾 Export to F: Drive</h3><p class="export-desc">Export training data as JSONL to <code>F:\\MockMate-AI-Training</code></p><button class="btn-export" onclick="doExport()" ${exporting||total===0?'disabled':''}>${exporting?'Exporting...':`Export ${stats?.unexported||0} New Samples`}</button>${exportResult?`<div class="export-result ${exportResult.error?'error':'success'}">${exportResult.error?'❌ '+exportResult.error:'✅ Exported '+exportResult.exported+' samples → '+exportResult.path}</div>`:''}</div>
    <div class="card"><h3>🔮 Fine-Tuning Roadmap</h3><div class="roadmap">${roadmapStep(1,'Collect Data','Use MockMate to practice & generate questions',total>0)}${roadmapStep(2,'Reach 500+ Samples',`${total}/500 samples collected`,total>=500)}${roadmapStep(3,'Export to F: Drive','Export JSONL training files',total>0&&(stats?.unexported===0))}${roadmapStep(4,'Fine-Tune Model','Run training script on exported data',false)}${roadmapStep(5,'Deploy Custom AI','Switch MockMate to your own model',false)}</div></div>
    <div class="card"><h3>⚙️ Backend Connection</h3><p class="export-desc">Point to your MockMate backend</p><div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap"><input class="config-input" id="apiUrlInput" value="${API_URL}"><button class="btn-save" onclick="saveApiUrl()">Save & Reconnect</button></div></div>
    <div class="auto-refresh">Auto-refreshes every 10 seconds</div>`;
}
function roadmapStep(n,t,d,done){return `<div class="roadmap-step"><div class="roadmap-num ${done?'done':'pending'}">${done?'✓':n}</div><div><div class="roadmap-title ${done?'done':''}">${t}</div><div class="roadmap-desc">${d}</div></div></div>`;}
fetchStats(); setInterval(fetchStats, 10000);
</script>
</body>
</html>
